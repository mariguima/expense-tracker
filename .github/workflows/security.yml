name: Security and regression checks
on:
  push:
  pull_request:
  schedule:
    - cron: '15 8 * * 1'
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-isolated-secret-not-a-deployment-secret
      APP_ENV: development
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m unittest discover -s tests -v
        working-directory: backend
      - run: python -m bandit -r app run.py
        working-directory: backend
      - run: python -m pip_audit -r backend/requirements.txt
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --audit-level=moderate
        working-directory: frontend
